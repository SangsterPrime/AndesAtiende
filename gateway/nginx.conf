worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    sendfile on;
    upstream ia_pool {
        server ia-1:8000 max_fails=1 fail_timeout=3s;
        server ia-2:8000 max_fails=1 fail_timeout=3s;
        keepalive 12;
    }
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    server {
        listen 8080;
        server_name _;
        client_max_body_size 32k;
        location = /health { add_header Content-Type text/plain; return 200 'ok'; }
        location = /api/health { proxy_pass http://dominio:8000/health; }
        location = /docs { proxy_pass http://dominio:8000/docs; }
        location = /api/openapi.json { proxy_pass http://dominio:8000/openapi.json; }
        # API de integración: conservar la clave del cliente, nunca inyectarla aquí.
        location = /api/predict {
            proxy_pass http://dominio:8000/predict;
        }
        location ^~ /api/predicciones/ {
            proxy_pass http://dominio:8000/predicciones/;
        }
        # BFF del chat público: la clave se añade SOLO en el servidor.
        # El template se renderiza al arrancar; no hay secreto en los archivos web.
        location = /api/chat {
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-API-Key "${EP3_API_KEY}";
            proxy_pass http://dominio:8000/chat;
        }
        location = /api/conversacion {
            proxy_pass http://dominio:8000/conversacion;
        }
        location ^~ /api/chat/respuesta/ {
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-API-Key "${EP3_API_KEY}";
            proxy_pass http://dominio:8000/chat/respuesta/;
        }
        location = /api/estadisticas {
            proxy_pass http://dominio:8000/estadisticas;
        }
        # Sin proxy genérico al dominio o a IA: bloquea alias y antiguas rutas internas.
        location = /api { return 404; }
        location /api/ { return 404; }
        location / { proxy_pass http://front:80; }
    }
    # Solo red Docker interna. Compose NO publica 8081 en el host.
    server {
        listen 8081;
        server_name _;
        client_max_body_size 32k;
        location = /predict { proxy_pass http://ia_pool/predict; }
        location / { return 404; }
    }
}
