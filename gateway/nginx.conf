worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    sendfile on;
    upstream ia_pool {
        server ia-1:8000 max_fails=1 fail_timeout=3s;
        server ia-2:8000 max_fails=1 fail_timeout=3s;
        keepalive 12;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 32k;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        location = /health { add_header Content-Type text/plain; return 200 'ok'; }
        location /api/ia/ {
            proxy_pass http://ia_pool/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
        location /api/ {
            proxy_pass http://dominio:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
        location / {
            proxy_pass http://front:80;
            proxy_set_header Host $host;
        }
    }
}
